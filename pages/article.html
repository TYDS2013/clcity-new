    </div>
    <div class="clock" id="siteClock">正在加载时间…</div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar__inner">
    <nav class="main-nav" aria-label="主导航">
      <ul>
        <li><a href="../index.html">主页</a></li>
        <li><a href="news.html">要闻</a></li>
        <li><a href="service.html">服务</a></li>

<main class="container" id="main">

        <div class="article-meta" id="articleMeta"></div>
        <div class="md-content" id="articleContent"></div>
      </div>
    </article>

    <!-- 右侧目录：固定在视口，随页面滚动保持可见 -->

      <nav class="toc" aria-label="文章目录">
        <p class="toc-title">目录</p>

<script src="../js/common.js"></script>
<!-- marked.js 完整 Markdown 解析（支持表格、任务列表、删除线等 GFM 语法） -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="../js/article-js.js"></script>
<script>
  // 时钟
  (function () {
    var el = document.getElementById('siteClock');
    var W = ['日','一','二','三','四','五','六'];
    function p(n){return n<10?'0'+n:''+n;}
    function t(){
      if(!el) return;
      var d = new Date();
      el.textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+W[d.getDay()]+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
    }
    t(); setInterval(t,1000);
  })();
</script>
</body>
</html>
