<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反馈 · 翠林城</title>
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../CSS/index-css.css">
<style>
  /* ===== 反馈页专用：跳转按钮 ===== */
  .feedback-jump-btn{
    display:flex;align-items:center;gap:18px;
    background:linear-gradient(135deg,#2e8b57,#226b43);
    color:#fff;text-decoration:none;
    padding:22px 26px;border-radius:10px;
    box-shadow:0 6px 20px rgba(46,139,87,.25);
    transition:transform .2s,box-shadow .2s;
  }
  .feedback-jump-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 28px rgba(46,139,87,.32);
    text-decoration:none;color:#fff;
  }
  .feedback-jump-btn__icon{font-size:32px;line-height:1;flex:0 0 auto;}
  .feedback-jump-btn__text{flex:1;min-width:0;}
  .feedback-jump-btn__text strong{display:block;font-size:17px;font-weight:700;margin-bottom:3px;}
  .feedback-jump-btn__text small{display:block;font-size:12.5px;opacity:.88;letter-spacing:.3px;}
  .feedback-jump-btn__arrow{font-size:26px;line-height:1;flex:0 0 auto;opacity:.9;}

  @media (max-width:520px){
    .feedback-jump-btn{padding:16px 18px;gap:14px;}
    .feedback-jump-btn__icon{font-size:26px;}
    .feedback-jump-btn__text strong{font-size:15.5px;}
  }
</style>
</head>
<body>

<header class="top-banner top-banner--small">
  <img class="top-banner__bg" src="../img/banner.svg" alt="翠林城城市风貌">
  <div class="top-banner__inner">
    <div class="brand">
      <img class="brand__mark" src="../img/favicon.svg" alt="翠林城图标" width="44" height="44">
      <div class="brand__text">
        <h1 class="brand__name">翠林城</h1>
        <p class="brand__sub">翠林城 · 综合政务服务中心</p>
      </div>
    </div>
    <div class="clock" id="siteClock">正在加载时间…</div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar__inner">
    <nav class="main-nav" aria-label="主导航">
      <ul>
        <li><a href="../index.html">主页</a></li>
        <li><a href="news.html">要闻</a></li>
        <li><a href="service.html">服务</a></li>
        <li><a href="feedback.html" class="active">反馈</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
    </nav>
    <form class="search" onsubmit="location.href='../index.html';return false;">
      <input type="search" placeholder="搜索要闻…" aria-label="站内搜索">
      <button type="submit">搜索</button>
    </form>
  </div>
</div>

<main class="container" id="main">
  <nav class="breadcrumb"><a href="../index.html">主页</a> &gt; <span>反馈</span></nav>

  <div class="feedback-layout">

    <!-- 上方：跳转飞书表单的按钮 -->
    <section class="feedback-block" aria-labelledby="fbFormTitle">
      <h2 id="fbFormTitle">提交反馈</h2>
      <p class="feedback-block__desc">
        点击下方按钮前往表单填写并提交反馈。提交完成后，可在本页下方表格中查看全部反馈记录与处理情况。
      </p>

      <a class="feedback-jump-btn"
         href="https://minecraft-cjyg.feishu.cn/share/base/form/shrcnhPARBHNTmEP3bstYrytyle"
         target="_blank" rel="noopener noreferrer">
        <span class="feedback-jump-btn__icon" aria-hidden="true">📝</span>
        <span class="feedback-jump-btn__text">
          <strong>前往表单提交反馈</strong>
          <small>将在新标签页中打开表单</small>
        </span>
        <span class="feedback-jump-btn__arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <!-- 下方：嵌入飞书多维表格，查看全部提交内容 -->
    <section class="feedback-block" aria-labelledby="fbStatusTitle">
      <h2 id="fbStatusTitle">全部反馈记录</h2>
      <!-- 
      <p class="feedback-block__desc">
        下方为飞书多维表格视图，展示所有已提交的反馈内容与处理状态，数据实时同步。
      </p>
      -->

      <iframe
        class="feedback-iframe feedback-iframe--status"
        id="feishuStatusFrame"
        src="https://minecraft-cjyg.feishu.cn/app/P7SMbS5uwakv93sX5lAcGXPgntf?from=from_copylink"
        title="全部反馈记录与处理情况"
        loading="lazy"
        referrerpolicy="no-referrer"
        sandbox="allow-forms allow-scripts allow-same-origin allow-popups"
      ></iframe>
    </section>

  </div>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <div class="footer-bottom__inner">
      <p>翠林城市民服务中心</p>
      <p class="footer-bottom__links">
        <a href="about.html">关于我们</a>
        <a href="feedback.html">意见反馈</a>
      </p>
    </div>
  </div>
</footer>

<script src="../JS/common.js"></script>
<script>
  // 时钟
  (function () {
    var el = document.getElementById('siteClock');
    var W = ['日','一','二','三','四','五','六'];
    function p(n){return n<10?'0'+n:''+n;}
    function t(){
      if(!el) return;
      var d = new Date();
      el.textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+W[d.getDay()]+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
    }
    t(); setInterval(t,1000);
  })();
</script>
</body>
</html>
