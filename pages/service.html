<script src="../JS/common.js"></script>
<script>
  // 时钟
  (function () {
    var el = document.getElementById('siteClock');
    var W = ['日','一','二','三','四','五','六'];
    function p(n){return n<10?'0'+n:''+n;}
    function t(){
      if(!el) return;
      var d = new Date();
      el.textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+W[d.getDay()]+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
    }
    t(); setInterval(t,1000);
  })();
</script>
